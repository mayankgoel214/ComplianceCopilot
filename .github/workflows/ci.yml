name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # A real Postgres with pgvector, so the store suite runs in CI rather than
      # skipping itself the way it does on a machine without a database.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: verity
          POSTGRES_DB: verity_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test
        env:
          VERITY_TEST_DATABASE_URL: postgres://postgres:verity@localhost:55432/verity_test

      - name: Build
        run: npm run build

      # The end-to-end suite runs against a local stub of the model API, started
      # by the Playwright config. It used to call the real one, which meant this
      # job could not pass unless the Gemini account was funded -- and when the
      # prepayment credits ran out, CI went red for a reason that had nothing to
      # do with the code. A pipeline that cannot tell you whether main is broken
      # unless a credit card is working is not doing its job.
      #
      # A consequence worth having: no secret is needed here any more, so a
      # fork's pull request gets the same coverage as a push to main.
      #
      # What this does not test is retrieval quality -- the stub's embeddings are
      # hashed, not learned. Quality is measured by the evaluation harness
      # against the real model, and that is the only place it is claimed.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --project=chromium
        env:
          # Present but deliberately not a real key: the stub never checks it,
          # and a real one here would let a mistake in the override guard reach
          # the paid API without anyone noticing.
          GOOGLE_GEMINI_API_KEY: stub-not-a-real-key
