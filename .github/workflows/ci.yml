name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # A real Postgres with pgvector, so the store suite runs in CI rather than
      # skipping itself the way it does on a machine without a database.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: verity
          POSTGRES_DB: verity_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test
        env:
          VERITY_TEST_DATABASE_URL: postgres://postgres:verity@localhost:55432/verity_test

      - name: Build
        run: npm run build

      # The end-to-end suite is split: everything that does not need a model key
      # always runs, so a fork's pull request still gets real coverage.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --project=chromium
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
