# Postgres with pgvector, for the integration test that exercises the
# PgVectorStore against a real database rather than a mock.
#
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:db
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: verity-pgvector-test
    environment:
      POSTGRES_PASSWORD: verity
      POSTGRES_DB: verity_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
